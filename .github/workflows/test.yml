name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs
jobs:
  codes:
    name: 码制自测 (Node)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: '22'
    - name: Code 128 / DataMatrix 自测
      run: node test/codes.test.mjs

  crosscheck:
    name: zxing-cpp 交叉解码
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: '22'
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: '3.13'
    - name: 安装解码器（哈希校验）
      run: pip install --require-hashes -r test/crosscheck/requirements.txt
    - name: 导出页面实际生成的码
      run: node test/crosscheck/export.mjs > symbols.json
    - name: 用 zxing-cpp 解码对照
      run: python test/crosscheck/decode.py symbols.json
