name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs
jobs:
  codes:
    name: 码制自测 (Node)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: '22'
    - name: Code 128 / DataMatrix 自测
      run: node test/codes.test.mjs
    - name: GS1 测试（与 qrbarcode 共用测试向量）
      run: node test/gs1.test.mjs
    # 本地那份向量必须与 qrbarcode 在记录的提交上的那份逐字节相同
    - name: 核对 GS1 测试向量与上游一致
      run: |
        src=$(sed -n "s/^  commit: '\([0-9a-f]\{40\}\)',$/\1/p" test/gs1.test.mjs)
        test -n "$src"
        curl -fsSL "https://raw.githubusercontent.com/foodsaid/qrbarcode/${src}/tests/gs1_vectors.json" -o upstream.json
        cmp upstream.json test/gs1_vectors.json

  crosscheck:
    name: zxing-cpp 交叉解码
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: '22'
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.13'
    - name: 安装解码器（哈希校验）
      run: pip install --require-hashes -r test/crosscheck/requirements.txt
    - name: 导出页面实际生成的码
      run: node test/crosscheck/export.mjs > symbols.json
    - name: 用 zxing-cpp 解码对照
      run: python test/crosscheck/decode.py symbols.json
